name: Build Check

# 复刻 Cloudflare Workers Builds 的构建流程，任何一步失败都会在 PR / push 上直接暴露，
# 避免又出现「点了部署按钮才发现构建不过」的情况。
on:
  push:
    branches: [ "main" ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      # Workers Builds 的安装命令
      - name: Install dependencies
        run: npm ci

      # Workers Builds 的构建命令（tsc --noEmit && vite build → public/）
      - name: Build frontend
        run: npm run build

      # 校验 wrangler 配置与 Worker 打包（dry-run 不上传、不需要凭据）
      - name: Wrangler dry-run
        run: npx wrangler deploy --dry-run --outdir=./dist-dry-run

      # 校验 Actions 部署模板 + 生成脚本：模板改坏了、占位符漏了，这里就会红。
      # 用假的密钥值跑一遍，验证生成出来的配置本身能通过 wrangler 校验。
      - name: Check deploy template & generator
        env:
          NAME: ci-check
          CUSTOM_DOMAIN: ci.example.com
          MAIL_KEYS: 'fake"key|with&specials$/'  # 故意塞特殊字符，验证替换是 JSON 安全的
          MAIL_SEND: 'CI <ci@example.com>'
          AUTH_KEYS: fake-auth-keys
          DB_SOURCE: d1
        run: |
          # 第二个参数是密钥文件：敏感项不再进 wrangler 配置（否则会被 deploy 明文打印）
          node scripts/gen-wrangler-config.mjs wrangler.action.ci.jsonc .deploy-secrets.ci.json
          node -e "
            const fs = require('fs');
            const cfg = JSON.parse(fs.readFileSync('wrangler.action.ci.jsonc', 'utf-8'));
            const sec = JSON.parse(fs.readFileSync('.deploy-secrets.ci.json', 'utf-8'));
            if (cfg.name !== 'ci-check') throw new Error('NAME 占位符未生效');
            // MAIL_KEYS 属敏感项：应进密钥文件，且绝不能出现在配置里。
            // 同时验证特殊字符未被破坏（生成是 JSON 安全的，不走 sed）。
            if ('MAIL_KEYS' in (cfg.vars ?? {})) throw new Error('敏感项 MAIL_KEYS 不应出现在 vars 中');
            if (sec.MAIL_KEYS !== 'fake\"key|with&specials$/') throw new Error('特殊字符被破坏: ' + sec.MAIL_KEYS);
            if (cfg.d1_databases[0].database_id !== undefined) throw new Error('未提供 D1 ID 时不应写入 database_id');
            // D1 库名默认必须跟 Worker 同名，避免面板里分不清哪个库配哪个 Worker
            if (cfg.d1_databases[0].database_name !== 'ci-check') throw new Error('D1 库名未跟随 Worker 名: ' + cfg.d1_databases[0].database_name);
            if (!cfg.assets || !cfg.assets.run_worker_first.includes('/api/*')) throw new Error('assets 配置丢失');
            console.log('部署模板与生成脚本校验通过 ✔');
          "
          npx wrangler deploy --dry-run --outdir=./dist-dry-run -c wrangler.action.ci.jsonc

          # 显式指定库名时必须被尊重（沿用旧库 DB_CF 的场景）
          D1_DATABASE_NAME=legacy-db node scripts/gen-wrangler-config.mjs wrangler.action.ci2.jsonc .deploy-secrets.ci2.json > /dev/null
          node -e "
            const cfg = JSON.parse(require('fs').readFileSync('wrangler.action.ci2.jsonc', 'utf-8'));
            if (cfg.d1_databases[0].database_name !== 'legacy-db') throw new Error('显式 D1_DATABASE_NAME 未生效');
            console.log('库名覆盖校验通过 ✔');
          "

      # 隐私回归测试：确保敏感值永远不写进 wrangler 配置。
      # 背景：`wrangler deploy` 会把 vars 的明文值打印到日志，而公开仓库的
      # Actions 日志人人可见（GitHub 只自动脱敏 secrets.* 来源的值）。
      - name: Check no sensitive values leak into wrangler config
        env:
          NAME: ci-leak-check
          MAIL_KEYS: 'sk_live_LEAKCANARY_KEY'
          MAIL_SEND: 'canary@leak.example.com'
          AUTH_KEYS: 'turnstile_LEAKCANARY'
          SITE_HOST: 'leak-canary.example.com'
          CUSTOM_DOMAIN: 'leak-canary.example.com'
          DCV_AGENT: 'dcv.leak-canary.example.com'
          DCV_EMAIL: 'canary@leak.example.com'
          DCV_TOKEN: 'cf_LEAKCANARY_TOKEN'
          ADMIN_MAIL: 'canary@leak.example.com'
          ADMIN_PASS_INPUT: 'LEAKCANARY_PASSWORD'
          SETUP_TOKEN_INPUT: 'LEAKCANARY_SETUP_TOKEN'
          DB_SOURCE: d1
        run: |
          set -uo pipefail
          node scripts/gen-wrangler-config.mjs wrangler.action.leak.jsonc .deploy-secrets.leak.json > gen.log 2>&1
          cat gen.log

          # 所有敏感值都不允许出现在生成日志里
          for v in 'sk_live_LEAKCANARY_KEY' 'canary@leak.example.com' 'turnstile_LEAKCANARY' \
                   'leak-canary.example.com' 'cf_LEAKCANARY_TOKEN' 'LEAKCANARY_PASSWORD' \
                   'LEAKCANARY_SETUP_TOKEN' 'dcv.leak-canary.example.com'; do
            if grep -qF "$v" gen.log; then echo "::error::生成日志泄漏了敏感值：$v"; exit 1; fi
          done

          # 敏感值不允许出现在 wrangler 配置里（routes 里的域名是唯一例外：
          # 建自定义域名路由必须写入配置，靠 CI 的 ::add-mask:: 脱敏）
          for v in 'sk_live_LEAKCANARY_KEY' 'canary@leak.example.com' 'turnstile_LEAKCANARY' \
                   'cf_LEAKCANARY_TOKEN' 'LEAKCANARY_PASSWORD' 'LEAKCANARY_SETUP_TOKEN'; do
            if grep -qF "$v" wrangler.action.leak.jsonc; then echo "::error::wrangler 配置泄漏了敏感值：$v"; exit 1; fi
          done

          # 敏感值必须全部出现在密钥文件里，否则部署后功能会缺失
          node -e "
            const s = JSON.parse(require('fs').readFileSync('.deploy-secrets.leak.json', 'utf-8'));
            const want = ['MAIL_KEYS','MAIL_SEND','AUTH_KEYS','SITE_HOST','DCV_AGENT','DCV_EMAIL',
                          'DCV_TOKEN','ADMIN_MAIL','ADMIN_PASS','SETUP_TOKEN'];
            const missing = want.filter((k) => !(k in s));
            if (missing.length) throw new Error('密钥文件缺少：' + missing.join(', '));
            if (s.ADMIN_PASS !== 'LEAKCANARY_PASSWORD') throw new Error('ADMIN_PASS 未正确收集');
            console.log('密钥文件校验通过 ✔ 共 ' + Object.keys(s).length + ' 项');
          "

          # 配置里不应再残留任何敏感 vars
          node -e "
            const c = JSON.parse(require('fs').readFileSync('wrangler.action.leak.jsonc', 'utf-8'));
            const bad = ['MAIL_KEYS','MAIL_SEND','AUTH_KEYS','DCV_TOKEN','ADMIN_MAIL','SITE_HOST']
              .filter((k) => c.vars && k in c.vars);
            if (bad.length) throw new Error('敏感项仍残留在 vars：' + bad.join(', '));
            console.log('配置中敏感 vars 已清空 ✔');
          "

      - name: Assert build output
        run: |
          test -f public/index.html || { echo "public/index.html 缺失"; exit 1; }
          test -n "$(ls -A public/assets 2>/dev/null)" || { echo "public/assets 为空"; exit 1; }
